@if (member(); as member) {
<div class="flex flex-col gap-3">
  <div class="flex gap-2">
    <span class="font-semibold">Member since:</span>
    <span>{{member.created | date:"longDate"}}</span>
  </div>
  <div>
    <span class="font-semibold">Last active:</span>
    <span> {{member.lastActive | date:"MMMM, d, y, h:mm:ss a"}} </span>
  </div>
  <h3 class="text-lg font-semibold text-primary">
    About {{member.displayName}}
  </h3>
  @if (membersService.editMode()) {
  <form
    #memberProfileEditForm="ngForm"
    (ngSubmit)="updateProfile()"
    class="flex flex-col w-full gap-4"
  >
    <label class="floating-label">
      <span>Display Name</span>
      <input
        type="text"
        name="displayName"
        [(ngModel)]="editableMember.displayName"
        placeholder="Display Name"
      />
    </label>
    <label class="floating-label">
      <span>Description</span>
      <input
        type="text"
        name="description"
        [(ngModel)]="editableMember.description"
        placeholder="Description"
      />
    </label>
    <label class="floating-label">
      <span>City</span>
      <input
        type="text"
        name="city"
        [(ngModel)]="editableMember.city"
        placeholder="City"
      />
    </label>
    <label class="floating-label">
      <span>Country</span>
      <input
        type="text"
        name="country"
        [(ngModel)]="editableMember.country"
        placeholder="Country"
      />
    </label>
    <div class="flex self-end">
      <button
        type="submit"
        class="btn btn-success"
      >
        Update Profile
      </button>
    </div>
  </form>
  } @else {
  <div>{{member.description}}</div>
  }
</div>
}
